[package]
name = "cesarops"
version = "0.1.0"
edition = "2021"
description = "CESARops — Collaborative Enhanced Search And Rescue Operations Platform"
authors = ["CESARops SAR Team"]

[dependencies]
axum = { version = "0.7", features = ["macros"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
geo = "0.28"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"

[features]
default = []
k9 = []
water = []
drone = []
maritime = []
cave = []
alpine = []

[lib]
name = "cesarops_lib"
path = "src/lib.rs"

[[bin]]
name = "cesarops"
path = "src/main.rs"
