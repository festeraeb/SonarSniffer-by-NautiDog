[package]
name = "tauri-appsonarsniffer"
version = "0.77.5"
description = "SonarSniffer by NautiDog Sailing"
authors = ["NautiDog Sailing"]
edition = "2021"
default-run = "tauri-appsonarsniffer"

[lib]
name = "tauri_appsonarsniffer_lib"
path = "src/lib.rs"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "2"
image = { version = "0.25", default-features = false, features = ["png", "webp"] }
gif = "0.13"
rusqlite = { version = "0.32", features = ["bundled"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
rfd = "0.15"
sha2 = "0.10"
ndarray = "0.16"
nauticuvs = "0.1.1"
base64 = "0.22"
mbtiles = "0.15.2"
rayon = "1.11.0"
crossbeam = "0.8.4"
flume = "0.12.0"

# SoundTiles-style feature alignment (opencv - requires LLVM/clang)
# Install LLVM: choco install llvm  OR  winget install LLVM.LLVM
# Then set: $env:LIBCLANG_PATH = "C:\Program Files\LLVM\bin"
opencv = { version = "0.93", features = ["features2d", "calib3d"], optional = true }

clap = { version = "4.5", features = ["derive"] }

[features]
default = []
video-gstreamer = ["dep:gstreamer", "dep:gstreamer-app"]

[[bin]]
name = "tauri-appsonarsniffer"
path = "src/main.rs"

[[bin]]
name = "probe_cli"
path = "src/bin/probe_cli.rs"

# test_alignment has been moved to the standalone `soundtiles` workspace crate

[dependencies.gstreamer]
version = "0.23"
optional = true

[dependencies.gstreamer-app]
version = "0.23"
optional = true
