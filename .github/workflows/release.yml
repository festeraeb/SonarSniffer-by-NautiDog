name: Release Installers

on:
  push:
    tags:
      - "v*"

jobs:
  build-release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ""
          - platform: macos-latest
            args: "--target universal-apple-darwin"

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "SonarsniffuerGuiTauri/src-tauri -> target"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Install frontend dependencies
        working-directory: SonarsniffuerGuiTauri
        run: npm install

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "SonarSniffer ${{ github.ref_name }}"
          releaseBody: |
            ## SonarSniffer ${{ github.ref_name }}

            Download the installer for your platform below:

            - **Windows**: `SonarSniffer_x.x.x_x64-setup.exe` or `SonarSniffer_x.x.x_x64_en-US.msi`
            - **macOS (Intel + Apple Silicon)**: `SonarSniffer_x.x.x_universal.dmg`

            See [USER_GUIDE.md](https://github.com/${{ github.repository }}/blob/main/SonarsniffuerGuiTauri/USER_GUIDE.md) for usage instructions.
          releaseDraft: false
          prerelease: false
          projectPath: SonarsniffuerGuiTauri
          args: ${{ matrix.args }}
