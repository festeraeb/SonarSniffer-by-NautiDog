[package]
name = "rust-garmin-rsd-cli"
version = "0.1.0"
edition = "2021"
autobins = false

[dependencies]
serde       = { version = "1", features = ["derive"] }
serde_json  = "1"
crc         = "3"

[[bin]]
name = "rsd_parse_cli"
path = "src/rsd_parse_cli.rs"

[[bin]]
name = "firmware_lookup_cli"
path = "src/firmware_lookup_cli.rs"

[[bin]]
name = "firmware_strings_cli"
path = "src/firmware_strings_cli.rs"

[[bin]]
name = "xor_blocks_sampler"
path = "src/xor_blocks_sampler.rs"
