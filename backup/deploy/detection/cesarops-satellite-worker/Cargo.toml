[package]
name = "cesarops-satellite-worker"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "satellite-worker"
path = "src/main.rs"

[dependencies]
nauticuvs = { path = "../nauticuvs" }

tokio = { version = "1", features = ["full"] }
axum = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
image = "0.25"
base64 = "0.22"
sqlx = { version = "0.8", features = ["sqlite", "runtime-tokio"] }
tower-http = { version = "0.6", features = ["cors"] }

# gdal-rs for GeoTIFF geotransform extraction (optional — falls back to image crate)
gdal = { version = "0.17", optional = true }

[features]
default = []
gdal-support = ["gdal"]
