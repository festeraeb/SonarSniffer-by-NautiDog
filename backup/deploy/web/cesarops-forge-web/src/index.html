<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CESAROPS Forge</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'OpenDyslexic', 'Segoe UI', sans-serif;
            background: #1a1a2e;
            color: #e0e0e0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        header {
            background: #16213e;
            padding: 1rem 2rem;
            border-bottom: 2px solid #0f3460;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        header h1 { color: #00d4ff; font-size: 1.5rem; }
        .status { color: #4caf50; font-size: 0.9rem; }
        .mode-buttons {
            display: flex;
            gap: 1rem;
            padding: 1rem 2rem;
            background: #16213e;
        }
        .mode-btn {
            padding: 1rem 2rem;
            font-size: 1.2rem;
            font-weight: bold;
            border: 2px solid #0f3460;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s;
            flex: 1;
            text-align: center;
        }
        .mode-btn:hover { transform: scale(1.02); }
        .mode-btn.active { border-color: #00d4ff; background: #0f3460; }
        .btn-plan { background: #1b4332; color: #95d5b2; }
        .btn-spec { background: #3d0066; color: #d4a5ff; }
        .btn-monitor { background: #4a1500; color: #ffb380; }
        .btn-auto { background: #003366; color: #80bfff; }

        .chat-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: 1rem 2rem;
            overflow: hidden;
        }
        .messages {
            flex: 1;
            overflow-y: auto;
            padding: 1rem 0;
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }
        .msg {
            max-width: 85%;
            padding: 1rem 1.5rem;
            border-radius: 16px;
            font-size: 1.1rem;
            line-height: 1.6;
            word-wrap: break-word;
            white-space: pre-wrap;
        }
        .msg-user {
            align-self: flex-end;
            background: #0f3460;
            color: #e0e0e0;
            border-bottom-right-radius: 4px;
        }
        .msg-assistant {
            align-self: flex-start;
            background: #1b4332;
            color: #e0e0e0;
            border-bottom-left-radius: 4px;
        }
        .input-area {
            display: flex;
            gap: 0.5rem;
            padding: 1rem 0;
        }
        .input-area input {
            flex: 1;
            padding: 1rem 1.5rem;
            font-size: 1.1rem;
            border: 2px solid #0f3460;
            border-radius: 12px;
            background: #16213e;
            color: #e0e0e0;
            outline: none;
        }
        .input-area input:focus { border-color: #00d4ff; }
        .input-area button {
            padding: 1rem 2rem;
            font-size: 1.1rem;
            font-weight: bold;
            background: #00d4ff;
            color: #1a1a2e;
            border: none;
            border-radius: 12px;
            cursor: pointer;
        }
        .input-area button:disabled { opacity: 0.5; cursor: not-allowed; }
        .loading { color: #00d4ff; font-style: italic; padding: 0.5rem; }

        @media (max-width: 768px) {
            .mode-buttons { flex-wrap: wrap; }
            .mode-btn { font-size: 1rem; padding: 0.8rem 1rem; }
            .msg { max-width: 95%; font-size: 1rem; }
        }
    </style>
</head>
<body>
    <header>
        <h1>CESAROPS FORGE</h1>
        <span class="status" id="status">Connecting...</span>
    </header>

    <div class="mode-buttons">
        <div class="mode-btn btn-plan active" onclick="setMode('plan')">PLAN</div>
        <div class="mode-btn btn-spec" onclick="setMode('spec')">SPEC</div>
        <div class="mode-btn btn-monitor" onclick="setMode('monitor')">MONITOR</div>
        <div class="mode-btn btn-auto" onclick="setMode('auto')">AUTO STATUS</div>
    </div>

    <div class="chat-container">
        <div class="messages" id="messages">
            <div class="msg msg-assistant">Welcome to CESAROPS Forge. I'm running on your local P100s. Ask me anything - design, code, scan strategy, cluster ops. Zero cloud cost.</div>
        </div>
        <div class="input-area">
            <input type="text" id="input" placeholder="Type your message..." onkeydown="if(event.key==='Enter')sendMessage()">
            <button id="sendBtn" onclick="sendMessage()">SEND</button>
        </div>
    </div>

    <script>
        let currentMode = 'plan';

        // Check health
        fetch('/health').then(r => r.json()).then(d => {
            document.getElementById('status').textContent = 'Connected - ' + d.service;
            document.getElementById('status').style.color = '#4caf50';
        }).catch(() => {
            document.getElementById('status').textContent = 'Offline';
            document.getElementById('status').style.color = '#f44336';
        });

        function setMode(mode) {
            currentMode = mode;
            document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
            event.target.classList.add('active');

            if (mode === 'monitor') {
                loadMonitor();
            }
        }

        async function sendMessage() {
            const input = document.getElementById('input');
            const msg = input.value.trim();
            if (!msg) return;

            input.value = '';
            addMessage('user', msg);

            const sendBtn = document.getElementById('sendBtn');
            sendBtn.disabled = true;
            addLoading();

            try {
                const resp = await fetch('/send', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({message: msg})
                });
                const data = await resp.json();
                removeLoading();
                if (data.tool_actions && data.tool_actions.length > 0) {
                    addToolActions(data.tool_actions);
                }
                addMessage('assistant', data.response);
            } catch(e) {
                removeLoading();
                addMessage('assistant', 'Error: ' + e.message);
            }

            sendBtn.disabled = false;
            input.focus();
        }

        function addMessage(role, content) {
            const div = document.createElement('div');
            div.className = 'msg msg-' + role;
            div.textContent = content;
            document.getElementById('messages').appendChild(div);
            div.scrollIntoView({behavior: 'smooth'});
        }

        function addLoading() {
            const div = document.createElement('div');
            div.className = 'loading';
            div.id = 'loading';
            div.textContent = 'Working... (using tools on P100s)';
            document.getElementById('messages').appendChild(div);
            div.scrollIntoView({behavior: 'smooth'});
        }

        function removeLoading() {
            const el = document.getElementById('loading');
            if (el) el.remove();
        }

        function addToolActions(actions) {
            const div = document.createElement('div');
            div.style.cssText = 'padding: 0.5rem 1rem; background: #2d1b4e; border-radius: 8px; font-size: 0.85rem; color: #d4a5ff; margin: 0.3rem 0;';
            div.textContent = 'Tools used: ' + actions.join(' → ');
            document.getElementById('messages').appendChild(div);
        }

        async function loadMonitor() {
            try {
                const resp = await fetch('/monitor');
                const data = await resp.json();
                const msgs = document.getElementById('messages');
                msgs.innerHTML = '<div class="msg msg-assistant"><pre>' + JSON.stringify(data, null, 2) + '</pre></div>';
            } catch(e) {
                addMessage('assistant', 'Monitor error: ' + e.message);
            }
        }

        // Voice input
        if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            const recognition = new SpeechRecognition();
            recognition.continuous = false;
            recognition.interimResults = false;
            recognition.onresult = (e) => {
                document.getElementById('input').value = e.results[0][0].transcript;
            };
            // Double-tap input to activate voice
            document.getElementById('input').addEventListener('dblclick', () => recognition.start());
        }
    </script>
</body>
</html>
