[package]
name = "warp-grid"
version = "0.1.0"
edition = "2021"
description = "CesarOps distributed heterogeneous compute runtime"

[dependencies]
# Compute & Graphics
wgpu = "29"
naga = "29"

# Networking & Async
quinn = "0.11"
axum = "0.8"
tokio = { version = "1", features = ["full"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bincode = "1"

# Data & Math
ndarray = "0.16"
half = "2"
bytemuck = { version = "1", features = ["derive"] }
rayon = "1.10"

# WASM Runtime
wasmtime = "25"

# Discovery & Updates
mdns-sd = "0.11"
self-replace = "1"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Utilities
uuid = { version = "1", features = ["v4"] }
thiserror = "1"
libc = "0.2"
regex = "1"
