[package]
name = "cesarops-xbox-worker"
version = "0.2.0"
edition = "2021"

[dependencies]
axum = "0.7"
tokio = { version = "1.36", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokenizers = "0.22.2"
ort = { version = "2.0.0-rc.12", features = ["directml", "half", "download-binaries"] }
ndarray = "0.17.2"
half = { version = "2.7.1", features = ["num-traits"] }
reqwest = { version = "0.12", features = ["json"] }

[target.'cfg(target_os = "windows")'.dependencies]
winapi = { version = "0.3", features = ["libloaderapi", "guiddef", "winerror"] }
