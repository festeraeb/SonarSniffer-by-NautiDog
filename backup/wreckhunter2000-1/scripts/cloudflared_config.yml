# ═══════════════════════════════════════════════════════════════════════════════
# Cloudflare Tunnel Config — T440 (primary, all services)
# ═══════════════════════════════════════════════════════════════════════════════
# Deploy to: /etc/cloudflared/config.yml on T440
# Then: sudo systemctl restart cloudflared
#
# All subdomains route to T440 services:
#   llm.cesarops.org  → KoboldCPP (port 5001) — LLM inference API
#   api.cesarops.org  → wrecks-api (port 8099) — REST API
#   app.cesarops.org  → frontend (port 8080) — static web app (nginx/caddy)
#   ssh.cesarops.org  → SSH (port 22) — remote access through firewalls
#
# cesarops2 is backup LLM only (when T440 is down or model-swapping)
# ═══════════════════════════════════════════════════════════════════════════════

# Tunnel ID — replace with your actual tunnel ID if different
# Find with: cloudflared tunnel list
tunnel: cesarops-main
credentials-file: /etc/cloudflared/cesarops-main.json

# Disable TLS verification for local services (they're HTTP on localhost)
originRequest:
  noTLSVerify: true

ingress:
  # ── LLM API (KoboldCPP or Cake, whichever is active) ────────────────────────
  - hostname: llm.cesarops.org
    service: http://localhost:5001
    originRequest:
      connectTimeout: 120s
      noHappyEyeballs: true

  # ── Wrecks REST API ─────────────────────────────────────────────────────────
  - hostname: api.cesarops.org
    service: http://localhost:8099

  # ── Frontend Web App ────────────────────────────────────────────────────────
  # Served by nginx or a simple static file server on T440
  # Previously pointed to cesarops3 — now T440 serves it directly
  - hostname: app.cesarops.org
    service: http://localhost:8080

  # ── SSH Access (bypasses school/corporate firewalls) ─────────────────────────
  # Client config: ProxyCommand cloudflared access ssh --hostname %h
  - hostname: ssh.cesarops.org
    service: ssh://localhost:22

  # ── Catch-all (required by cloudflared) ─────────────────────────────────────
  - service: http_status:404
