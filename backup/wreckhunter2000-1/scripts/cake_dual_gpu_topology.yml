# Cake topology: shard Qwen2.5-Coder-3B across GTX 1070 (8GB) + P1000 (4GB)
# 36 layers total — split proportional to VRAM (8:4 = 2:1 ratio)
# 1070 gets 24 layers, P1000 gets 12 layers

- host: "localhost"
  device: 0
  description: "GTX 1070 8GB — primary worker"
  layers:
    - "model.layers.0-23"

- host: "localhost"
  device: 1
  description: "Quadro P1000 4GB — secondary/auditor"
  layers:
    - "model.layers.24-35"
