version: '3.8'

services:
  # ---------------------------------------------------------
  # SATELLITE WATER (DEEP WATER / THERMAL / SAR WRECK SEARCH)
  # ---------------------------------------------------------
  satellite-water-specialist:
    build:
      context: .
      dockerfile: Dockerfile.specialist
    image: cesarops-specialist:latest
    container_name: cesarops-satellite-water
    environment:
      - CESAR_NODE_ROLE=satellite_water
      - PORT=8001
    ports:
      - "8001:8001"
    volumes:
      - ./downloads:/app/downloads
      - ./outputs:/app/outputs
      - ./models:/app/models
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  # ---------------------------------------------------------
  # SATELLITE LAND (AIRCRAFT CRASHES / VEGETATION / NDVI)
  # ---------------------------------------------------------
  satellite-land-specialist:
    image: cesarops-specialist:latest
    container_name: cesarops-satellite-land
    environment:
      - CESAR_NODE_ROLE=satellite_land
      - PORT=8002
    ports:
      - "8002:8002"
    volumes:
      - ./downloads:/app/downloads
      - ./outputs:/app/outputs
      - ./models:/app/models

  # ---------------------------------------------------------
  # MAGNETICS (AERIAL MAGNETIC SURVEY ANALYSIS)
  # ---------------------------------------------------------
  magnetics-specialist:
    image: cesarops-specialist:latest
    container_name: cesarops-magnetics
    environment:
      - CESAR_NODE_ROLE=magnetics
      - PORT=8003
    ports:
      - "8003:8003"
    volumes:
      - ./downloads:/app/downloads
      - ./db:/app/db

  # ---------------------------------------------------------
  # SONAR (NOAA BAG / BATHYMETRIC POINT CLOUDS)
  # ---------------------------------------------------------
  sonar-specialist:
    image: cesarops-specialist:latest
    container_name: cesarops-sonar
    environment:
      - CESAR_NODE_ROLE=sonar
      - PORT=8004
    ports:
      - "8004:8004"
    volumes:
      - ./downloads:/app/downloads
