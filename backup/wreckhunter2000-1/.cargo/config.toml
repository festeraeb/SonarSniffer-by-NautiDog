# CESAROPS Build Configuration
# Forces LLVM to generate code native to the exact host CPU instructions.
#
# On the T440 (Xeon Silver 4110): enables AVX-512F, AVX-512CD, AVX-512BW, AVX-512DQ
# This gives 8 × f64 per cycle per core = 537 GFLOPS FP64 across 32 threads.
#
# On your Windows laptop: enables whatever your CPU supports (likely AVX2).
# The binary won't be portable — it's optimised for the machine it's built on.
#
# For cross-compilation to the T440 from Windows, use:
#   cargo build --release --target x86_64-unknown-linux-gnu
# with the appropriate cross-compilation toolchain.

[build]
rustflags = ["-C", "target-cpu=native"]

# When building for the T440 specifically (cross-compile from Windows):
# [target.x86_64-unknown-linux-gnu]
# linker = "x86_64-linux-gnu-gcc"
# rustflags = ["-C", "target-cpu=skylake-avx512"]
