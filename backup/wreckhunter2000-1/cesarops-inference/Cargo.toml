[package]
name = "cesarops-inference"
version = "0.1.0"
edition = "2021"
description = "Native Rust LLM inference engine — zero-copy GridBuffer, distributed KV cache, custom FP16 shaders"

[lib]
name = "cesarops_inference"
path = "src/lib.rs"

[[bin]]
name = "cesarops-inference"
path = "src/main.rs"

[dependencies]
# GPU compute
wgpu = "24"

# Numeric types
half = "2"
bytemuck = { version = "1", features = ["derive"] }

# Memory mapping (GGUF zero-init from RAID)
memmap2 = "0.9"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Async runtime + HTTP server
tokio = { version = "1", features = ["full"] }
axum = "0.8"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Error handling
thiserror = "1"
anyhow = "1"

# System calls (NUMA pinning, mlock)
libc = "0.2"

# Candle ML framework (WebGPU backend for P100) — disabled until fork is cloned
# candle-core = { path = "../crates/candle-fork/candle-core" }

[features]
default = ["wgpu-backend"]
wgpu-backend = []
cuda-backend = []
