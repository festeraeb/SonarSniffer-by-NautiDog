[package]
name = "nauticuvs"
version = "0.2.0"
edition = "2021"

[features]
default = []
# Precision flags — mutually exclusive; f64 is the default (no flag needed)
# Use f32-fast ONLY for GPU-bound preprocessing where throughput > accuracy
f32-fast = []       # 32-bit floats — faster on GPU, lossy for curvelet math
f64 = []            # explicit f64 — same as default, kept for backward compat
# FFT backend
fftw = ["dep:fftw"]
# Coordinate reprojection (requires PROJ C library — Linux nodes only)
proj = ["dep:proj"]
# GeoTIFF with GDAL (requires GDAL system library)
gdal-support = ["dep:gdal"]
# XLA TPU compilation — enable when the xla crate stabilises
# xla = ["dep:xla"]

[dependencies]
# Existing
wgpu        = "29.0.1"
bytemuck    = { version = "1.18.0", features = ["derive"] }
ndarray     = "0.17.2"
geo-types   = "0.7.19"
serde       = { version = "1.0.228", features = ["derive"] }
serde_json  = "1.0.149"

# New — always present
num-complex = { version = "0.4.6", features = ["serde"] }
rustfft     = "6.2.0"
aligned-vec = "0.5.0"
thiserror   = "1.0.69"
tiff        = "0.9.1"
proj        = { version = "0.27.0", optional = true }
log         = "0.4.22"

# New — optional backends
fftw        = { version = "0.8.0", optional = true }
gdal        = { version = "0.17", optional = true }
# xla is not yet available as a stable crate — the #[cfg_attr(feature="xla",...)] annotations
# are no-ops when this feature is inactive. Enable when the xla crate stabilises.
# xla       = { version = "0.1.6", optional = true }

[dev-dependencies]
proptest    = "1.5.0"
approx      = "0.5.1"
criterion   = { version = "0.5.1", features = ["html_reports"] }
