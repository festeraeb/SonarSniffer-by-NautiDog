# MCP stack sidecars for CESAROPS Forge (cesarops2).
# Usage: docker compose -f docker/mcp-stack.compose.yml up -d
services:
  context7-proxy:
    image: nginx:alpine
    container_name: context7-proxy
    restart: unless-stopped
    ports:
      - "127.0.0.1:3737:80"
    volumes:
      - ./context7-proxy.conf:/etc/nginx/conf.d/default.conf:ro

  crawl4ai:
    image: unclecode/crawl4ai:latest
    container_name: crawl4ai
    restart: unless-stopped
    ports:
      - "127.0.0.1:11235:11235"
    shm_size: "1g"

  openmemory-mcp:
    image: mem0/openmemory-mcp:latest
    container_name: openmemory-mcp
    restart: unless-stopped
    ports:
      - "127.0.0.1:8765:8765"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      USER: cesarops
      QDRANT_HOST: host.docker.internal
      QDRANT_PORT: "6333"
      # Set a real key in ~/.config/cesarops/mcp-stack.env for memory extraction.
      OPENAI_API_KEY: ${OPENAI_API_KEY:-none}
