# Cluster Configuration — managed by web UI
# Anything we can't handle natively falls back to KoboldCPP

[bootstrap]
model = "/codebase/models/qwen2.5-coder-1.5b-instruct-q6_k.gguf"
port = 5002
backend = "cpu"
template = "qwen2.5"

[fallback]
# KoboldCPP handles formats we don't support (MXFP4, GGML v1, etc.)
enabled = true
binary = "/home/cesarops/koboldcpp"
port = 5001
# Supported native quant types (everything else goes to koboldcpp)
native_quants = ["Q4_0", "Q4_K_M", "Q6_K", "Q8_0", "F16", "F32", "BF16"]

[[gpu]]
id = 0
name = "P100 #1"
bus_id = "5E:00.0"
vram_mb = 16384
host = "local"

[[gpu]]
id = 1
name = "P100 #2"
bus_id = "AF:00.0"
vram_mb = 16384
host = "local"

[[gpu]]
id = 2
name = "GTX 1060"
vram_mb = 6144
host = "100.105.77.74"
port_base = 5570

[[worker]]
name = "Thinker"
role = "think"
gpu = 0
model = "/codebase/models/Qwen2.5-Coder-7B-Instruct-abliterated-Q8_0.gguf"
port = 5010
template = "qwen2.5"
enabled = true
engine = "koboldcpp"
backend = "vulkan"
inject_vectors = true
memory_pool = ""

# P100 #0 (port 5001) — Gemma-4-26B-MoE IQ4_XS — big hitter #1
[[worker]]
name = "GemmaBig"
role = "code"
gpu = 0
model = "/codebase/models/Gemma-4-26B-MoE-IQ4_XS.gguf"
port = 5001
template = "gemma"
enabled = true
engine = "koboldcpp"
backend = "vulkan"
inject_vectors = true
memory_pool = ""
# Launch flags — match what koboldcpp needs for this exact P100 setup.
# vulkan_device pins which Vulkan adapter koboldcpp picks (Pascal needs explicit).
# gpulayers=999 = full offload (Gemma-4-26B-MoE fits in 16 GB IQ4_XS).
vulkan_device = 0
gpulayers = 999
contextsize = 8192
threads = 4

# P100 #1 (port 5002) — Qwen3.6-35B-A3B Q4_K_M — big hitter #2 (partial offload)
[[worker]]
name = "QwenBig"
role = "code"
gpu = 1
model = "/codebase/models/Qwen3.6-35B-A3B-Q4_K_M.gguf"
port = 5002
template = "qwen2.5"
enabled = true
engine = "koboldcpp"
backend = "vulkan"
inject_vectors = true
memory_pool = ""
# Qwen3.6-35B-A3B at Q4_K_M is ~21 GB — only 32 layers fit on a 16 GB P100,
# the rest spill to CPU/RAM. Pinned to vulkan_device 1 to stay off P100 #0.
vulkan_device = 1
gpulayers = 32
contextsize = 8192
threads = 4

