preset = "balanced_tooling"

[[corrector_preset_match]]
pattern = 'deepseek-r1-distill-qwen-32b|qwen3\.6-35b|gemma-4-26b'
preset = "reasoning_relaxed"

[tuning]
# Same tool N times → progress-report demands (break think/repeat loops).
corrector_hard_repeat_cap = 6
# Only after this many repeats → force plain-text final answer.
corrector_hard_terminate_after = 12
corrector_llm_loop_judge = true
corrector_think_only_after = 8
corrector_tool_fix = false
generation_timeout_secs = 1200
max_generation_tokens = 16384
max_think_rounds = 24
skip_corrector = false
temperature = 0.4000000059604645
thinker_timeout_secs = 60

[[worker]]
backend = "cuda"
enabled = false
engine = "llama-server"
gpu = 0
host = "local"
inject_vectors = true
memory_pool = ""
model = "/codebase/models/Qwopus3.5-9B-Coder-MTP-Q4_K_M.gguf"
name = "gpu0-idle"
port = 5001
role = "idle"
template = "qwen2.5"

