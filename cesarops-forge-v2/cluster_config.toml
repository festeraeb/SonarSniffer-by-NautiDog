loop_threshold = 3
suggest_after = 10
demand_ack_after = 14
reboot_after = 18
wso_auto = true
vector_inject = true
correction_strength = "medium"
description = "Balanced tool contract for mid-size models"

[corrector_preset.reasoning_relaxed]
