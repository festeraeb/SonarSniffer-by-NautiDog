[package]
name = "cesarops-slicer"
version = "0.1.0"
edition = "2021"
description = "Zero-copy memory-mapped GeoTIFF tile slicer with coordinate baking for CESAROPS distributed satellite analysis"
authors = ["CESAROPS"]

[[bin]]
name = "slicer"
path = "src/main.rs"

[[bin]]
name = "llm_worker"
path = "src/llm_worker.rs"

[dependencies]
memmap2 = "0.9"
tiff = "0.9"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
ndarray = "0.15"
geo-types = { version = "0.7", features = ["serde"] }
clap = { version = "4.4", features = ["derive", "env"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1.0"
thiserror = "1.0"
rayon = "1.8"
sha2 = "0.10"
chrono = { version = "0.4", features = ["serde"] }
reqwest = { version = "0.11", features = ["json"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
notify = "6.1"
wgpu = "29.0.1"
bytemuck = "1.25.0"
pollster = "0.4.0"
stac = "0.17.0"
stac-api = "0.8.2"
oxigdal-geotiff = "0.1.4"
sled = "0.34.7"
llm = "0.1.1"
hf-hub = "0.5.0"
roxmltree = "0.19"
urlencoding = "2.1"
pdf-extract = "0.7"
scraper = "0.18"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

[[bin]]
name = "thermal_specialist"
path = "src/thermal_specialist.rs"

[[bin]]
name = "optical_structural_worker"
path = "src/optical_structural_worker.rs"

[[bin]]
name = "sar_slick_worker"
path = "src/sar_slick_worker.rs"

[[bin]]
name = "reef_anomaly_filter"
path = "src/reef_anomaly_filter.rs"

[[bin]]
name = "bathymetry_specialist"
path = "src/bathymetry_specialist.rs"

[[bin]]
name = "chemistry_specialist"
path = "src/chemistry_specialist.rs"

[[bin]]
name = "model_team_tool"
path = "src/model_team_tool.rs"

[[bin]]
name = "research_ingestion_specialist"
path = "src/research_ingestion_specialist.rs"

[workspace]
