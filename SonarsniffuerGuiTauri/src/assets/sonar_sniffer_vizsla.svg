<svg width="220" height="110" viewBox="0 0 220 110" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Water -->
  <ellipse cx="110" cy="100" rx="90" ry="12" fill="#6bb6e6"/>
  <!-- Wreck (underwater) -->
  <g opacity="0.7">
    <rect x="150" y="92" width="32" height="8" rx="2" fill="#7a6c5a"/>
    <rect x="160" y="88" width="8" height="8" rx="2" fill="#b0a080"/>
    <rect x="170" y="94" width="6" height="4" rx="1" fill="#b0a080"/>
  </g>
  <!-- Boat -->
  <rect x="60" y="70" width="100" height="16" rx="8" fill="#d8a36c" stroke="#a87b4a" stroke-width="2"/>
  <polygon points="60,86 110,104 160,86" fill="#b88c5a"/>
  <!-- Vizsla Dog -->
  <ellipse cx="110" cy="60" rx="22" ry="16" fill="#c46a2b"/>
  <ellipse cx="132" cy="60" rx="10" ry="12" fill="#c46a2b"/>
  <ellipse cx="88" cy="60" rx="10" ry="12" fill="#c46a2b"/>
  <ellipse cx="110" cy="44" rx="10" ry="10" fill="#c46a2b"/>
  <ellipse cx="110" cy="36" rx="5" ry="3" fill="#c46a2b"/>
  <!-- Nose -->
  <ellipse cx="110" cy="34" rx="2" ry="1.2" fill="#2b3a4a"/>
  <!-- Jacket -->
  <rect x="100" y="56" width="20" height="10" rx="5" fill="#3a7ad9"/>
  <rect x="108" y="56" width="4" height="10" rx="2" fill="#a3d6ff"/>
  <!-- Echo beams -->
  <g opacity="0.7">
    <path d="M110 34 Q130 20 170 92" stroke="#3a7ad9" stroke-width="2" fill="none"/>
    <path d="M110 34 Q120 30 150 92" stroke="#a3d6ff" stroke-width="2" fill="none"/>
    <path d="M110 34 Q100 30 130 92" stroke="#6bb6e6" stroke-width="2" fill="none"/>
  </g>
  <!-- Echo returns (off wreck) -->
  <circle cx="170" cy="92" r="4" fill="#3a7ad9" opacity="0.5"/>
  <circle cx="150" cy="92" r="3" fill="#a3d6ff" opacity="0.5"/>
  <circle cx="130" cy="92" r="2.5" fill="#6bb6e6" opacity="0.5"/>
</svg>