[workspace]
# CESAROPS workspace — actively-built SAR + inference crates.
# Other crates (sovereign-cloud, cesarops-thought-engine, cesarops-mcp-*,
# etc.) remain as standalone workspaces because they have divergent or
# stale deps. Add them here as they're brought current.
#
# nauticuvs-full is the INTERNAL full-precision f64 version used by the
# SAR pipeline. It is renamed at the package level so it cannot be
# accidentally published to crates.io (the public crates.io `nauticuvs`
# is intentionally detuned).
members = [
    "cesarops-inference",
    "cesarops-forge-v2",
    "cesarops-detection",
    "cesarops-aeromagnetic-worker",
    "nauticuvs",
]
# The top-level cesarops-adaptive package below is also a member implicitly
# (because [package] is at the root).
resolver = "2"

[package]
name = "cesarops-adaptive"
version = "0.1.0"
edition = "2021"
description = "Unified Adaptive Detection Pipeline for CESAROPS"

[dependencies]
# Core Data Processing
ndarray = "0.15"
ndarray-rand = "0.14"
geo = "0.28"

# Async & Network
tokio = { version = "1.35", features = ["full"] }
reqwest = { version = "0.11", features = ["json"] }
axum = "0.7"

# Serialization & Utils
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.6", features = ["v4", "serde"] }
tracing = "0.1"
tracing-subscriber = "0.3"

# Math
nalgebra = "0.32"
