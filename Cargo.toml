[workspace]
# CESAROPS workspace — only the actively-built SAR + inference crates.
# Other crates (sovereign-cloud, nauticuvs, cesarops-thought-engine,
# cesarops-aeromagnetic-worker, etc.) remain as standalone workspaces
# because they have divergent or stale deps. Add them here when they're
# brought back to current Cargo / wgpu versions.
#
# cesarops-aeromagnetic-worker is currently broken: missing Cargo.toml,
# expects nauticuvs-publish path that doesn't exist, active nauticuvs
# crate is missing curvelet_forward + Scalar exports. Track for v2.
members = [
    "cesarops-inference",
    "cesarops-forge-v2",
    "cesarops-detection",
]
# The top-level cesarops-adaptive package below is also a member implicitly
# (because [package] is at the root).
resolver = "2"

[package]
name = "cesarops-adaptive"
version = "0.1.0"
edition = "2021"
description = "Unified Adaptive Detection Pipeline for CESAROPS"

[dependencies]
# Core Data Processing
ndarray = "0.15"
ndarray-rand = "0.14"
geo = "0.28"

# Async & Network
tokio = { version = "1.35", features = ["full"] }
reqwest = { version = "0.11", features = ["json"] }
axum = "0.7"

# Serialization & Utils
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.6", features = ["v4", "serde"] }
tracing = "0.1"
tracing-subscriber = "0.3"

# Math
nalgebra = "0.32"
