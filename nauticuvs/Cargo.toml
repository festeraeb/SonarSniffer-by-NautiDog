[package]
name = "nauticuvs-full"
version = "0.1.2-internal"
edition = "2021"
authors = ["Thom Hadfield -- NautiDog Sailing"]
description = "Fast Discrete Curvelet Transform (FDCT) via wrapping — INTERNAL FULL-PRECISION VERSION"
license = "MIT OR Apache-2.0"
# DO NOT PUBLISH. The crates.io `nauticuvs` is intentionally detuned.
# This is the internal full-precision f64 version used by the SAR/wreck
# detection pipeline. Name is deliberately different from the crates.io
# package so `cargo publish` is impossible without a manual rename.
publish = false

[dependencies]
ndarray = "0.16"
ndarray-npy = "0.7"
rustfft = "6.2"
num-complex = "0.4"
num-traits = "0.2"
rayon = { version = "1.10", optional = true }
thiserror = "2"
clap = { version = "4.4", features = ["derive"] }

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
approx = "0.5"
rand = "0.8"

[features]
default = []
parallel = ["rayon"]

[profile.release]
opt-level = 3
lto = true

[[bin]]
name = "mag_curvelet_energy"
path = "src/bin/mag_curvelet_energy.rs"

[[bin]]
name = "curvelet_bandpass"
path = "src/bin/curvelet_bandpass.rs"
