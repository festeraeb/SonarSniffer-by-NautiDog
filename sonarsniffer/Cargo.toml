[package]
name = "sonarsniffer"
version = "0.8.0"
description = "SonarSniffer by NautiDog — Professional Marine Survey Analysis"
authors = ["NautiDog Sailing"]
edition = "2021"

[lib]
name = "sonarsniffer_lib"
path = "src/lib.rs"

[[bin]]
name = "sonarsniffer-cli"
path = "src/bin/probe_cli.rs"

[[bin]]
name = "parse_cli"
path = "src/bin/parse_cli.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "2"
image = { version = "0.25", default-features = false, features = ["png", "webp"] }
rusqlite = { version = "0.32", features = ["bundled"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
sha2 = "0.10"
ndarray = "0.16"
base64 = "0.22"
rayon = "1"
crossbeam = "0.8"
flume = "0.12"
gif = "0.13"
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Curvelet denoising (nauticuvs from crates.io)
nauticuvs = "0.1.1"

# MBTiles output
mbtiles = "0.15"

# GStreamer video (required for MP4 export)
[dependencies.gstreamer]
version = "0.23"
optional = true

[dependencies.gstreamer-app]
version = "0.23"
optional = true

# OpenCV for SoundTiles feature alignment
[dependencies.opencv]
version = "0.93"
features = ["features2d", "calib3d"]
optional = true

[features]
default = ["video-gstreamer"]
video-gstreamer = ["dep:gstreamer", "dep:gstreamer-app"]
soundtiles = ["dep:opencv"]
full-license = []

# Tauri desktop app (separate binary, only for release builds)
# Build with: cargo tauri build
