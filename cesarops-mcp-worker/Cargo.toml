[package]
name = "cesarops-mcp-worker"
version = "0.1.0"
edition = "2021"
description = "MCP-compatible GPU worker for self-organizing agent swarm"

[dependencies]
rmcp = { version = "0.1", features = ["server", "transport-sse"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
axum = "0.7"
tracing = "0.1"
reqwest = { version = "0.11", features = ["json"] }
human-size = "0.4"
hostname = "0.3"
uuid = { version = "1", features = ["v4"] }
chrono = "0.4"
glob = "0.3"
clap = { version = "4", features = ["derive"] }
