[package]
name = "cesarops-wso-server"
version = "0.1.0"
edition = "2021"

[dependencies]
cesarops-wso = { path = "../cesarops-wso" }
axum = "0.8"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[workspace]
