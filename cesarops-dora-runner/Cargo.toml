[package]
name = "cesarops-dora-runner"
version = "0.1.0"
edition = "2021"
description = "Pilot mission graph runner — HTTP bridge to Forge/n8n (dora-rs phase scaffold)"

[[bin]]
name = "cesarops-dora-runner"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
clap = { version = "4", features = ["derive"] }
