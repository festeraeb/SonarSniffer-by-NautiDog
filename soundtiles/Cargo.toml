[package]
name = "soundtiles"
version = "0.1.0"
edition = "2021"
description = "SoundTiles mosaic processor for SonarSniffer — standalone CLI"
authors = ["NautiDog Sailing"]

[[bin]]
name = "soundtiles"
path = "src/main.rs"

[dependencies]
anyhow    = "1"
clap      = { version = "4.5", features = ["derive"] }
image     = { version = "0.25", default-features = false, features = ["png"] }
serde     = { version = "1", features = ["derive"] }
serde_json = "1"
chrono    = { version = "0.4", default-features = false, features = ["clock"] }
