[package]
name = "nauti_inferer"
version = "4.0.0"
edition = "2021"
description = "Distributed inference control plane — DashMap sharded runtime, authenticated workers, cancellable jobs, typed protocols, structured telemetry"
authors = ["CESAROPS"]
license = "AGPL-3.0"

[dependencies]
axum = { version = "0.8", features = ["ws", "macros"] }
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
dashmap = "6"
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
futures-util = "0.3"
reqwest = { version = "0.12", features = ["json", "stream"] }
ed25519-dalek = { version = "2", features = ["rand_core"] }
rand = "0.8"
bytes = "1"
chrono = { version = "0.4", features = ["serde"] }
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "sqlite", "uuid", "chrono"] }
async-stream = "0.3"
tokio-stream = "0.1"

[profile.release]
lto = true
strip = true
