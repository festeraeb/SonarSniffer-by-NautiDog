[package]
name = "nauti_inferer"
version = "4.0.0"
edition = "2021"
description = "Distributed inference control plane — DashMap sharded runtime, authenticated workers, cancellable jobs, typed protocols, structured telemetry"
authors = ["CESAROPS"]
license = "AGPL-3.0"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.6", features = ["cors"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["json", "stream"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
lto = true
strip = true
