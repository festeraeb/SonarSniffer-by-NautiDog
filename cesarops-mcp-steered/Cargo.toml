[package]
name = "cesarops-mcp-steered"
version = "0.1.0"
edition = "2021"
description = "MCP server with nautivecs vector-steered LLM inference — grounded reasoning for any OpenAI-compatible endpoint"

[[bin]]
name = "cesarops-mcp"
path = "src/main.rs"

[profile.release]
lto = true
codegen-units = 1
strip = true

[dependencies]
# MCP protocol (official Rust SDK)
rmcp = { version = "0.1", features = ["server", "transport-io"] }

# Async runtime
tokio = { version = "1", features = ["full"] }
futures = "0.3"

# HTTP client for LLM endpoint + n8n webhook
reqwest = { version = "0.12", features = ["json"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# nautivecs integration (workspace crate)
nautivecs = { path = "../nautivecs" }

# CLI + config
clap = { version = "4", features = ["derive", "env"] }

# Error handling
anyhow = "1"
thiserror = "1"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Utilities
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
